# The team's pipeline. It runs on every push, but it uses a floating image, commits a secret,
# downloads every package on every run, and one of the three checks can never fail the job.
image: python:latest

variables:
  OAUTH_CLIENT_SECRET: "dev-oauth-secret-123"

test:
  script:
    - pip install -r requirements.txt
    - ruff check . ; ruff format --check . ; pytest
