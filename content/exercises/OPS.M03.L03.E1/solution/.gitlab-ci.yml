# Runs for pushes (no workflow rules restrict it). OAUTH_CLIENT_SECRET is a masked
# CI/CD variable in Settings > CI/CD > Variables, not in this file.
default:
  image: python:3.12-slim
  cache:
    key:
      files:
        - requirements.txt
    paths:
      - .cache/pip
  before_script:
    - python -m pip install -r requirements.txt

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"

stages:
  - check

lint:
  stage: check
  script:
    - ruff check .
    - ruff format --check .

test:
  stage: check
  script:
    - pytest -q
